<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aerodrome Weather Observation System Display">
    <title id="page-title">AWOS Display</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #09090b;
            --bg-shell: #121214;
            --bg-well: #0c0c0e;
            --fg-primary: #f5f5f7;
            --fg-secondary: #a1a0ab;
            --fg-muted: #6e6d78;
            --accent: #fc4c01;
            --green: #30d158;
            --blue: #4da3ff;
            --red: #ff453a;
            --shadow-apple:
                inset 0 0 0 1px rgba(255, 255, 255, 0.075),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.09),
                inset 0 -1px 0 0 rgba(0, 0, 0, 0.45),
                0 2px 6px rgba(0, 0, 0, 0.35),
                0 12px 32px rgba(0, 0, 0, 0.45);
            --shadow-well:
                inset 0 0 0 1px rgba(255, 255, 255, 0.055),
                inset 0 2px 10px rgba(0, 0, 0, 0.55);
            --ease-out-expo: cubic-bezier(0.22, 1, 0.36, 1);
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
        }

        * {
            box-sizing: border-box;
        }

        ::selection {
            background-color: rgba(252, 76, 1, 0.16);
            color: #fc4c01;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 28px;
            background-color: var(--bg-canvas);
            color: var(--fg-primary);
            font-family: var(--font-sans);
            font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .awos-grid {
            flex: 1;
            width: 100%;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 24px;
            align-items: stretch;
        }

        .awos-col {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .rare-shell {
            position: relative;
            background: var(--bg-shell);
            border-radius: 28px;
            padding: 22px;
            box-shadow: var(--shadow-apple);
            overflow: hidden;
        }

        .rare-shell::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(120% 75% at 50% -10%, rgba(255, 255, 255, 0.055), transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .rare-shell > * {
            position: relative;
            z-index: 1;
        }

        .readout-recessed {
            background: var(--bg-well);
            border-radius: 18px;
            box-shadow: var(--shadow-well);
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 12px;
            margin-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.065);
        }

        .section-title-group {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .section-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
        }

        .section-dot.blue {
            background: var(--blue);
        }

        .section-title {
            margin: 0;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.5);
        }

        .text-label-tech {
            font-size: 10px;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.12em;
            color: var(--fg-muted);
        }

        .digital-font {
            font-family: var(--font-mono);
            font-variant-numeric: tabular-nums;
        }

        /* Compass */
        .compass-stage {
            padding: 36px;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 460px;
        }

        .bearing-overlay {
            position: absolute;
            top: 24px;
            right: 28px;
            text-align: right;
            pointer-events: none;
        }

        .bearing-val {
            font-size: 44px;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: var(--fg-primary);
            line-height: 1.05;
            margin-top: 2px;
        }

        .compass-container {
            position: relative;
            width: 390px;
            height: 390px;
            margin: 0 auto;
            user-select: none;
        }

        .compass-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 312px;
            height: 312px;
            border-radius: 50%;
            background: radial-gradient(circle, #141417 0%, #09090b 100%);
            box-shadow:
                inset 0 0 0 1px rgba(255, 255, 255, 0.10),
                inset 0 4px 20px rgba(0, 0, 0, 0.7),
                0 8px 32px rgba(0, 0, 0, 0.65);
            z-index: 1;
        }

        .compass-number {
            position: absolute;
            color: var(--fg-muted);
            font-family: var(--font-mono);
            font-weight: 600;
            font-size: 14px;
            transform-origin: center;
            user-select: none;
            pointer-events: none;
            z-index: 10;
        }

        .compass-number.cardinal {
            color: var(--accent);
            font-size: 18px;
            font-weight: 700;
        }

        .runway-line {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 24px;
            height: 276px;
            background: #1d1d21;
            border-radius: 4px;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
            transform: translate(-50%, -50%) rotate(var(--rwy-rot, 30deg));
            pointer-events: none;
            z-index: 2;
        }

        .runway-line::after {
            content: '';
            position: absolute;
            top: 8px;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            background: repeating-linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0.35) 0,
                rgba(255, 255, 255, 0.35) 12px,
                transparent 12px,
                transparent 24px
            );
        }

        .runway-label-top,
        .runway-label-bottom {
            position: absolute;
            left: 50%;
            color: var(--fg-primary);
            font-size: 12px;
            font-weight: 700;
            font-family: var(--font-mono);
        }

        .runway-label-top {
            top: -22px;
            transform: translateX(-50%);
        }

        .runway-label-bottom {
            bottom: -22px;
            transform: translateX(-50%) rotate(180deg);
        }

        .compass-arrow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 4px;
            height: 140px;
            background: transparent;
            transform-origin: bottom center;
            transform: translate(-50%, -100%) rotate(0deg);
            pointer-events: none;
            z-index: 20;
            transition: transform 1.6s var(--ease-out-expo);
        }

        .arrow-head {
            position: absolute;
            top: -13px;
            left: -9px;
            width: 0;
            height: 0;
            border-left: 11px solid transparent;
            border-right: 11px solid transparent;
            border-bottom: 20px solid var(--accent);
        }

        .arrow-shaft {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--accent);
            border-radius: 2px;
        }

        .speed-dial {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 122px;
            height: 122px;
            background: #101013;
            border-radius: 50%;
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow:
                inset 0 0 0 1px rgba(255, 255, 255, 0.10),
                0 8px 28px rgba(0, 0, 0, 0.85);
        }

        .speed-dial-val {
            font-size: 36px;
            font-weight: 700;
            color: var(--accent);
            line-height: 1;
            margin-top: 2px;
        }

        /* Status & Zulu Bar */
        .status-bar {
            padding: 22px 26px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 9px;
            border-radius: 999px;
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.06em;
        }

        .status-online {
            background: rgba(48, 209, 88, 0.14);
            color: var(--green);
            box-shadow: inset 0 0 0 1px rgba(48, 209, 88, 0.25);
        }

        .status-offline {
            background: rgba(255, 69, 58, 0.14);
            color: var(--red);
            box-shadow: inset 0 0 0 1px rgba(255, 69, 58, 0.25);
        }

        .led {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #3f3f46;
            display: inline-block;
            transition: background 0.15s ease;
        }

        .led.on {
            background: var(--green);
        }

        .zulu-clock-lg {
            font-size: 46px;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: var(--fg-primary);
            line-height: 1;
        }

        /* Telemetry Cards */
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
            flex: 1;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
            margin-bottom: 16px;
        }

        .telemetry-well {
            padding: 24px 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .telemetry-val-xl {
            font-size: 62px;
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1;
        }

        .telemetry-val-lg {
            font-size: 42px;
            font-weight: 700;
            letter-spacing: -0.025em;
            line-height: 1;
        }

        .telemetry-val-md {
            font-size: 34px;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1;
        }

        .unit-tag {
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.06em;
            color: var(--fg-muted);
        }

        @media (max-width: 1024px) {
            .awos-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 640px) {
            body { padding: 14px; }
            .compass-container { zoom: 0.72; }
            .grid-3 { grid-template-columns: 1fr; }
            .status-bar { flex-direction: column; align-items: flex-start; gap: 12px; }
            .zulu-clock-lg { font-size: 32px; }
            .telemetry-val-xl { font-size: 44px; }
        }
    </style>
</head>
<body>

    <div class="awos-grid">
        <!-- LEFT COLUMN: Compass & Clock -->
        <div class="awos-col">
            <div class="rare-shell" style="display: flex; flex-direction: column; flex: 1;">
                <div class="readout-recessed compass-stage">
                    <div class="bearing-overlay">
                        <div class="text-label-tech">WIND BEARING</div>
                        <div id="dir-text" class="bearing-val digital-font">---°</div>
                    </div>

                    <div class="compass-container" id="compass">
                        <div class="compass-ring">
                            <div class="runway-line">
                                <span class="runway-label-top" id="rwy-top">03</span>
                                <span class="runway-label-bottom" id="rwy-bot">21</span>
                            </div>
                        </div>
                        <div id="compass-face" style="position: absolute; inset: 0; pointer-events: none;"></div>
                        <div class="compass-arrow" id="windArrow">
                            <div class="arrow-shaft"></div>
                            <div class="arrow-head"></div>
                        </div>
                        <div class="speed-dial">
                            <span class="text-label-tech" style="font-size: 10px;">KTS</span>
                            <span id="compass-speed-display" class="speed-dial-val digital-font">--</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Clock & Status -->
            <div class="rare-shell status-bar">
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span class="text-label-tech">STATION STATUS</span>
                        <span id="conn-status" class="status-pill status-offline">OFFLINE</span>
                        <div id="led-rx" class="led"></div>
                    </div>
                    <span class="text-label-tech" style="color: rgba(255,255,255,0.32);">ZULU TIME REFERENCE</span>
                </div>
                <span id="disp-utc-clock" class="zulu-clock-lg digital-font">00:00:00 Z</span>
            </div>
        </div>

        <!-- RIGHT COLUMN: Telemetry -->
        <div class="awos-col">
            <!-- Wind Dynamics -->
            <div class="rare-shell" style="display: flex; flex-direction: column; flex: 1;">
                <header class="section-header">
                    <div class="section-title-group">
                        <div class="section-dot"></div>
                        <h2 class="section-title">Wind Dynamics</h2>
                    </div>
                    <span class="text-label-tech">ANEMOMETER</span>
                </header>

                <div class="grid-2">
                    <div class="readout-recessed telemetry-well">
                        <span class="text-label-tech">SURFACE VELOCITY</span>
                        <div style="display: flex; align-items: baseline; gap: 8px;">
                            <span id="card-windSpd" class="telemetry-val-xl digital-font" style="color: var(--accent);">--</span>
                            <span class="unit-tag" style="color: rgba(252, 76, 1, 0.65);">KTS</span>
                        </div>
                    </div>
                    <div class="readout-recessed telemetry-well">
                        <span class="text-label-tech">PEAK GUST</span>
                        <div style="display: flex; align-items: baseline; gap: 8px;">
                            <span id="card-windGust" class="telemetry-val-xl digital-font" style="color: var(--fg-secondary);">--</span>
                            <span class="unit-tag">KTS</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Meteorology & Pressure -->
            <div class="rare-shell" style="display: flex; flex-direction: column; flex: 1.25;">
                <header class="section-header">
                    <div class="section-title-group">
                        <div class="section-dot blue"></div>
                        <h2 class="section-title">Meteorology & Pressure</h2>
                    </div>
                    <span class="text-label-tech">ATMOSPHERIC</span>
                </header>

                <div class="grid-3">
                    <div class="readout-recessed telemetry-well" style="padding: 20px 14px;">
                        <span class="text-label-tech">TEMPERATURE</span>
                        <div style="display: flex; align-items: baseline; gap: 4px;">
                            <span id="card-temp" class="telemetry-val-md digital-font">--</span>
                            <span class="unit-tag">°C</span>
                        </div>
                    </div>
                    <div class="readout-recessed telemetry-well" style="padding: 20px 14px;">
                        <span class="text-label-tech">DEW POINT</span>
                        <div style="display: flex; align-items: baseline; gap: 4px;">
                            <span id="card-dew" class="telemetry-val-md digital-font">--</span>
                            <span class="unit-tag">°C</span>
                        </div>
                    </div>
                    <div class="readout-recessed telemetry-well" style="padding: 20px 14px;">
                        <span class="text-label-tech">VISIBILITY</span>
                        <div style="display: flex; align-items: baseline; gap: 4px;">
                            <span id="card-vis" class="telemetry-val-md digital-font">----</span>
                            <span class="unit-tag">M</span>
                        </div>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="readout-recessed telemetry-well">
                        <span class="text-label-tech">ALTIMETER (QNH)</span>
                        <div style="display: flex; align-items: baseline; gap: 6px;">
                            <span id="card-qnh" class="telemetry-val-lg digital-font" style="color: var(--blue);">----</span>
                            <span class="unit-tag" style="color: rgba(77, 163, 255, 0.65);">hPa</span>
                        </div>
                    </div>
                    <div class="readout-recessed telemetry-well">
                        <span class="text-label-tech">FIELD (QFE)</span>
                        <div style="display: flex; align-items: baseline; gap: 6px;">
                            <span id="card-qfe" class="telemetry-val-lg digital-font" style="color: var(--blue);">----</span>
                            <span class="unit-tag" style="color: rgba(77, 163, 255, 0.65);">hPa</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tempo GIF (Hidden) -->
    <img id="tempo-gif" src="" style="display: none; position: fixed; inset: 0; margin: auto; width: 100vw; height: 100vh; object-fit: contain; background: rgba(0,0,0,0.95); z-index: 9999;" />

    <script>
        const statusText = document.getElementById('conn-status');
        const ledRx = document.getElementById('led-rx');
        let localState = { windDir: 340, windSpd: 0, windGust: 0, temp: 0, dew: 0, vis: 9999, qnh: 1013, qfe: 898 };
        let lastTempoTrigger = null;
        let lastKeepGoingTrigger = null;

        const arrow = document.getElementById('windArrow');
        const compassSpeedDisplay = document.getElementById('compass-speed-display');
        const dirTextDisplay = document.getElementById('dir-text');

        function playGif(url) {
            const gif = document.getElementById('tempo-gif');
            if (gif) {
                gif.src = url + "?" + new Date().getTime();
                gif.style.display = 'block';
                setTimeout(() => {
                    gif.style.display = 'none';
                    gif.src = "";
                }, 5000);
            }
        }

        async function fetchFromServer() {
            try {
                const res = await fetch('/get_awos');
                const data = await res.json();
                if (data.tempoTrigger && lastTempoTrigger !== null && data.tempoTrigger > lastTempoTrigger) playGif("https://media1.tenor.com/m/KdQ8WRxaK7EAAAAC/stop-jk-simmons.gif");
                if (data.keepGoingTrigger && lastKeepGoingTrigger !== null && data.keepGoingTrigger > lastKeepGoingTrigger) playGif("https://media1.tenor.com/m/josaiwe4bSoAAAAC/jk-simmons-whiplash.gif");
                lastTempoTrigger = data.tempoTrigger || 0;
                lastKeepGoingTrigger = data.keepGoingTrigger || 0;
                localState = data;
                flashRx();
                updateUI();
                if (statusText) {
                    statusText.innerText = "ONLINE";
                    statusText.className = "status-pill status-online";
                }
            } catch (e) {
                console.error("Fetch error:", e);
                if (statusText) {
                    statusText.innerText = "OFFLINE";
                    statusText.className = "status-pill status-offline";
                }
            }
        }

        function flashRx() {
            if (ledRx) {
                ledRx.classList.add('on');
                setTimeout(() => ledRx.classList.remove('on'), 200);
            }
        }

        function updateUI() {
            const dirStr = (localState.windDir || 0).toString().padStart(3, '0');
            if (document.getElementById('card-windSpd')) document.getElementById('card-windSpd').innerText = localState.windSpd;
            if (document.getElementById('card-windGust')) document.getElementById('card-windGust').innerText = localState.windGust.toString().padStart(2, '0');
            if (document.getElementById('card-temp')) document.getElementById('card-temp').innerText = localState.temp;
            if (document.getElementById('card-dew')) document.getElementById('card-dew').innerText = localState.dew;
            if (document.getElementById('card-vis')) document.getElementById('card-vis').innerText = localState.vis || 9999;
            if (document.getElementById('card-qnh')) document.getElementById('card-qnh').innerText = localState.qnh;
            if (document.getElementById('card-qfe')) document.getElementById('card-qfe').innerText = localState.qfe || 898;

            if (compassSpeedDisplay) compassSpeedDisplay.innerText = localState.windSpd;
            if (dirTextDisplay) dirTextDisplay.innerText = dirStr + "°";
            updateArrowVisuals();
        }

        function updateArrowVisuals() {
            const rotation = localState.windDir || 0;
            if (arrow) arrow.style.transform = `translate(-50%, -100%) rotate(${rotation}deg)`;
        }

        function initCompassFace() {
            const faceContainer = document.getElementById('compass-face');
            if (!faceContainer) return;
            const numberRadius = 172;
            for (let i = 10; i <= 360; i += 10) {
                const label = document.createElement('div');
                label.innerText = (i / 10).toString().padStart(2, '0');
                const isCardinal = (i % 90 === 0);
                label.className = `compass-number ${isCardinal ? 'cardinal' : ''}`;
                const rad = (i - 90) * (Math.PI / 180);
                const x = numberRadius * Math.cos(rad);
                const y = numberRadius * Math.sin(rad);
                label.style.left = `50%`;
                label.style.top = `50%`;
                label.style.transform = `translate(-50%, -50%) translate(${x}px, ${y}px)`;
                faceContainer.appendChild(label);
            }
        }

        function updateClock() {
            const now = new Date();
            const h = now.getUTCHours().toString().padStart(2, '0');
            const m = now.getUTCMinutes().toString().padStart(2, '0');
            const s = now.getUTCSeconds().toString().padStart(2, '0');
            const clockEl = document.getElementById('disp-utc-clock');
            if (clockEl) clockEl.innerText = `${h}:${m}:${s} Z`;
        }

        async function initSettings() {
            try {
                const res = await fetch('/get_generator_settings');
                const data = await res.json();
                if (data.awos_airport_id) document.getElementById('page-title').innerText = data.awos_airport_id + " AWOS Display";
                if (data.awos_rwy_top) {
                    document.getElementById('rwy-top').innerText = data.awos_rwy_top;
                    let topHeading = parseInt(data.awos_rwy_top) * 10;
                    if (isNaN(topHeading) || topHeading === 0) topHeading = 360;
                    document.documentElement.style.setProperty('--rwy-rot', topHeading + 'deg');
                }
                if (data.awos_rwy_bottom) document.getElementById('rwy-bot').innerText = data.awos_rwy_bottom;
            } catch (e) { }
        }

        initCompassFace();
        initSettings();
        setInterval(fetchFromServer, 2000);
        setInterval(initSettings, 5000);
        setInterval(updateClock, 1000);
        fetchFromServer();
        updateClock();
    </script>
</body>
</html>
