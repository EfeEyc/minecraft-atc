            } else if (leftRadialMenuScreen === 'spawn_type') {
                labels[0] = { title: "SMALL PLANE", sub: "SPAWN" };
                labels[1] = { title: "LARGE PLANE", sub: "SPAWN" };
                labels[2] = { title: "FOLLOWME", sub: "VEHICLE" };
                labels[3] = { title: "TRUCK", sub: "VEHICLE" };
                labels[4] = { title: "BACK", sub: "RETURN" };
            } else if (leftRadialMenuScreen === 'spawn_rules_small' || leftRadialMenuScreen === 'spawn_rules_large') {
                const typeStr = leftRadialMenuScreen === 'spawn_rules_small' ? "SMALL" : "LARGE";
                labels[0] = { title: "VFR", sub: `${typeStr} VFR` };
                labels[1] = { title: "IFR", sub: `${typeStr} IFR` };
                labels[2] = { title: "BACK", sub: "RETURN" };
            } else if (leftRadialMenuScreen === 'routing_action') {
                labels[0] = { title: "FLY", sub: "DEPART" };
                labels[1] = { title: "TAXI", sub: "GROUND" };
                labels[2] = { title: "CANCEL", sub: "ABORT" };
                labels[3] = { title: "TP", sub: "LAST WP" };
            }

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            for (let i = 0; i < numSegments; i++) {
                let startAng, endAng;
                if (numSegments === 6) {
                    startAng = 240 + i * 60;
                    endAng = 300 + i * 60;
                } else if (numSegments === 5) {
                    if (i === 1) { startAng = -54; endAng = 18; }
                    else if (i === 2) { startAng = 18; endAng = 90; }
                    else if (i === 3) { startAng = 90; endAng = 162; }
                    else if (i === 4) { startAng = 162; endAng = 234; }
                    else { startAng = 234; endAng = 306; }
                } else if (numSegments === 3) {
                    if (i === 0) { startAng = 210; endAng = 330; }
                    else if (i === 1) { startAng = 330; endAng = 450; }
                    else { startAng = 90; endAng = 210; }
                } else if (numSegments === 4) {
                    if (i === 0) { startAng = -45; endAng = 45; }
                    else if (i === 1) { startAng = 45; endAng = 135; }
                    else if (i === 2) { startAng = 135; endAng = 225; }
                    else { startAng = 225; endAng = 315; }
                } else if (numSegments === 2) {
                    if (i === 0) { startAng = -90; endAng = 90; }
                    else { startAng = 90; endAng = 270; }
                }

                const midAngleRad = ((startAng + endAng) / 2) * Math.PI / 180;
                const tx = cx + Math.cos(midAngleRad) * 145;
                const ty = cy + Math.sin(midAngleRad) * 145;

                const isSelected = (selected === i);
                ctx.fillStyle = isSelected ? '#ffffff' : '#a0aec0';
                
                // Draw Title
                ctx.font = 'bold 15px ui-sans-serif, system-ui, -apple-system, sans-serif';
                ctx.fillText(labels[i].title, tx, ty - 6);
                
                // Draw Sub-label
                ctx.fillStyle = isSelected ? '#00d2ff' : '#0099cc';
                ctx.font = 'bold 9px ui-sans-serif, system-ui, -apple-system, sans-serif';
                ctx.fillText(labels[i].sub || (isSelected ? "SELECT" : ""), tx, ty + 12);
            }

            // Draw glowing thumbstick position dot
            ctx.beginPath();
            ctx.arc(cx + stickX * 160, cy + stickY * 160, 10, 0, 2 * Math.PI);
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = '#00d2ff';
            ctx.shadowBlur = 15;
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.restore();
            leftRadialMenuTexture.needsUpdate = true;
        }

        function drawSector(ctx, cx, cy, innerR, outerR, startAngle, endAngle, isSelected) {
            ctx.beginPath();
            ctx.arc(cx, cy, outerR, startAngle, endAngle, false);
            ctx.arc(cx, cy, innerR, endAngle, startAngle, true);
            ctx.closePath();
            
            if (isSelected) {
                ctx.fillStyle = 'rgba(0, 210, 255, 0.45)';
                ctx.fill();
                ctx.strokeStyle = '#00d2ff';
                ctx.lineWidth = 4;
                ctx.stroke();
            } else {
                ctx.fillStyle = 'rgba(10, 20, 40, 0.55)';
                ctx.fill();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        async function sendRoutingAction(actionType) {
            const planeId = routingPlaneId;
            if (!planeId) return;

            // Capture waypoints to avoid race conditions with closeRoutingState clearing it
            const waypointsCopy = [...routingWaypoints];

            // 1. If waypoints were plotted, upload the route first
            if (waypointsCopy.length > 0) {
                console.log("VR Grab-Route: Uploading route:", waypointsCopy);
                try {
                    await fetch('/send_route', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ plane_tag: planeId, route: waypointsCopy.join(', ') })
                    });
                } catch (e) {
                    console.error("VR Grab-Route: Error sending route:", e);
                }
            }

            // 2. Perform target action
            try {
                if (actionType === 'fly' || actionType === 'taxi') {
                    console.log(`VR Grab-Route: Setting status to ${actionType}`);
                    await fetch('/set_status', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ plane_tag: planeId, mode: actionType })
                    });
                    
                    // Update local status so local panel draws immediately
                    const plane = planes.find(p => p.id === planeId);
                    if (plane) {
                        plane.status = actionType;
                        if (waypointsCopy.length > 0) plane.route = waypointsCopy.join(', ');
                        drawVRControlPanel(plane);
                    }
                } else if (actionType === 'tp') {
                    if (waypointsCopy.length > 0) {
                        const targetID = waypointsCopy[waypointsCopy.length - 1];
                        console.log("VR Grab-Route: Teleport plane to last waypoint: " + targetID);
                        await fetch('/teleport_plane', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ plane_tag: planeId, wp_id: targetID })
                        });
                    }
                }
            } catch (e) {
                console.error("VR Grab-Route: Action Error:", e);
            }
        }

        function closeRoutingState() {
            if (routingController && routingGhostGroup) {
                routingController.remove(routingGhostGroup);
            }
            routingGhostGroup = null;
            
            if (routingLine) {
                scene.remove(routingLine);
                if (routingLine.geometry) routingLine.geometry.dispose();
                if (routingLine.material) routingLine.material.dispose();
                routingLine = null;
            }
            
            routingController = null;
            routingPlaneId = null;
            routingWaypoints = [];
        }

        function executeLeftRadialAction(segment) {
            console.log("Executing Left Radial Action for screen:", leftRadialMenuScreen, "segment:", segment);
            triggerHapticFeedback(0.8, 100);

            let shouldClose = true;

            if (leftRadialMenuScreen === 'routing_action') {
                if (segment === 0) { // FLY
                    sendRoutingAction("fly");
                } else if (segment === 1) { // TAXI
                    sendRoutingAction("taxi");
                } else if (segment === 2) { // CANCEL
                    // Just closes
                } else if (segment === 3) { // TP
                    sendRoutingAction("tp");
                }
                closeRoutingState();
                leftRadialMenuScreen = 'main';
                shouldClose = true;
            } else if (leftRadialMenuScreen === 'main') {
                if (segment === 0) { // PAUSE/RESUME
                    const targetState = !isPaused;
                    isPaused = targetState;
                    fetch('/toggle_pause', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ paused: targetState })
                    })
                    .then(r => r.json())
                    .catch(err => console.error("RCON Pause Error:", err));
                }
                else if (segment === 1) { // SPAWN PLANE
                    leftRadialMenuScreen = 'spawn_type';
                    shouldClose = false;
                }
                else if (segment === 2) { // TRIGGER CRASH
                    spawningToolActive = 'CRASH';
                    shouldClose = false;
                }
                else if (segment === 3) { // WEATHER
                    const targetWeather = currentWeatherState === 'rain' ? 'clear' : 'rain';
                    currentWeatherState = targetWeather;
                    fetch('/set_weather', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ type: targetWeather })
                    })
                    .then(r => r.json())
                    .catch(err => console.error("RCON Weather Error:", err));
                }
                else if (segment === 4) { // AWOS
                    if (awosTablet) {
                        awosTablet.visible = !awosTablet.visible;
                        if (awosTablet.visible) {
                            updateAwosData();
                        }
                    }
                }
                else if (segment === 5) { // KILL ALL
                    leftRadialMenuScreen = 'kill_confirm';
                    shouldClose = false;
                }
            } else if (leftRadialMenuScreen === 'kill_confirm') {
                if (segment === 0) { // CONFIRM
                    fetch('/kill_all', { method: 'POST' })
                        .then(r => r.json())
                        .catch(err => console.error("Error killing all:", err));
                    leftRadialMenuScreen = 'main';
                } else {
                    leftRadialMenuScreen = 'main';
                    shouldClose = false;
                }
            }
            else if (leftRadialMenuScreen === 'spawn_type') {
                if (segment === 0) { // SMALL PLANE
                    leftRadialMenuScreen = 'spawn_rules_small';
                    shouldClose = false;
                }
                else if (segment === 1) { // LARGE PLANE
                    leftRadialMenuScreen = 'spawn_rules_large';
                    shouldClose = false;
                }
                else if (segment === 2) { // FOLLOWME
                    spawningToolActive = 'FOLLOWME';
                    shouldClose = false;
                }
                else if (segment === 3) { // TRUCK
                    spawningToolActive = 'TRUCK';
                    shouldClose = false;
                }
                else if (segment === 4) { // BACK to main
                    leftRadialMenuScreen = 'main';
                    shouldClose = false;
                }
            }
            else if (leftRadialMenuScreen === 'spawn_rules_small') {
                if (segment === 0) { // VFR
                    spawningToolActive = 'PLANE_SMALL_VFR';
                    shouldClose = false;
                }
                else if (segment === 1) { // IFR
                    spawningToolActive = 'PLANE_SMALL_IFR';
                    shouldClose = false;
                }
                else if (segment === 2) { // BACK to spawn_type
                    leftRadialMenuScreen = 'spawn_type';
                    shouldClose = false;
                }
            }
            else if (leftRadialMenuScreen === 'spawn_rules_large') {
                if (segment === 0) { // VFR
                    spawningToolActive = 'PLANE_LARGE_VFR';
                    shouldClose = false;
                }
                else if (segment === 1) { // IFR
                    spawningToolActive = 'PLANE_LARGE_IFR';
                    shouldClose = false;
                }
                else if (segment === 2) { // BACK to spawn_type
                    leftRadialMenuScreen = 'spawn_type';
                    shouldClose = false;
                }
            }

            if (shouldClose) {
                leftRadialMenuOpen = false;
                if (leftRadialMenuMesh) leftRadialMenuMesh.visible = false;
            } else {
                // Instantly redraw the sub-screen
                drawLeftRadialMenu(0, 0);
            }
        }

        function createAwosTablet() {
            const group = new THREE.Group();

            awosCanvas = document.createElement('canvas');
            awosCanvas.width = 768;
            awosCanvas.height = 1024;
            awosCtx = awosCanvas.getContext('2d');

            awosTexture = new THREE.CanvasTexture(awosCanvas);
            const pageGeo = new THREE.PlaneGeometry(0.3, 0.4);
            const pageMat = new THREE.MeshBasicMaterial({
                map: awosTexture,
                transparent: true,
                side: THREE.DoubleSide,
                depthWrite: false
            });
            const pageMesh = new THREE.Mesh(pageGeo, pageMat);
            pageMesh.name = "awosPage";
            group.add(pageMesh);

            const backGeo = new THREE.PlaneGeometry(0.32, 0.42);
            const backMat = new THREE.MeshPhysicalMaterial({
                color: 0x070b19,
                roughness: 0.1,
                metalness: 0.1,
                transmission: 0.9,
                opacity: 0.75,
                transparent: true,
                depthWrite: false
            });
            const backMesh = new THREE.Mesh(backGeo, backMat);
            backMesh.position.z = -0.005;
            group.add(backMesh);

            const topBarGeo = new THREE.BoxGeometry(0.1, 0.02, 0.01);
            const topBarMat = new THREE.MeshStandardMaterial({
                color: 0x00ffff,
                roughness: 0.1,
                metalness: 0.9
            });
            const topBarMesh = new THREE.Mesh(topBarGeo, topBarMat);
            topBarMesh.position.set(0, 0.19, 0.005);
            group.add(topBarMesh);

            group.visible = false;
            group.position.set(0.0, 0.18, -0.12);
            group.rotation.set(-Math.PI / 3, 0, 0);

            return group;
        }

        function drawAwosTablet(hoverX = null, hoverY = null) {
            if (!awosCanvas || !awosCtx) return;

            const ctx = awosCtx;
            ctx.clearRect(0, 0, awosCanvas.width, awosCanvas.height);
            ctx.save();
            ctx.scale(2, 2);

            const w = 384;
            const h = 512;

            const grad = ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, 'rgba(10, 15, 30, 0.85)');
            grad.addColorStop(1, 'rgba(5, 7, 15, 0.95)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            ctx.strokeStyle = 'rgba(0, 210, 255, 0.25)';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(10, 10, w - 20, h - 20);

            ctx.beginPath();
            ctx.moveTo(10, 50); ctx.lineTo(w - 10, 50);
            ctx.moveTo(10, 230); ctx.lineTo(w - 10, 230);
            ctx.moveTo(192, 50); ctx.lineTo(192, 230);
            ctx.stroke();

            ctx.fillStyle = '#00d2ff';
            ctx.font = 'bold 18px "IBM Plex Sans", sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillText("AWOS STATION", 25, 30);

            ctx.textAlign = 'right';
            ctx.fillStyle = '#00ff66';
            ctx.font = 'bold 11px "IBM Plex Sans", sans-serif';
            ctx.fillText("• SYSTEM ACTIVE", w - 25, 30);

            const state = awosData || {
                windDir: 340, windSpd: 12, windGust: 0,
                temp: 18, dew: 10, qnh: 1013, qfe: 898, vis: 9999
            };

            const cx = 101;
            const cy = 140;
            const r = 60;

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, 2 * Math.PI);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(cx, cy, r - 12, 0, 2 * Math.PI);
            ctx.strokeStyle = 'rgba(0, 210, 255, 0.08)';
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 11px "IBM Plex Sans", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText("N", cx, cy - r + 8);
            ctx.fillText("S", cx, cy + r - 8);
            ctx.fillText("E", cx + r - 8, cy);
            ctx.fillText("W", cx - r + 8, cy);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 1;
            for (let deg = 0; deg < 360; deg += 30) {
                if (deg % 90 === 0) continue;
                const rad = deg * Math.PI / 180;
                ctx.beginPath();
                ctx.moveTo(cx + Math.cos(rad) * (r - 4), cy + Math.sin(rad) * (r - 4));
                ctx.lineTo(cx + Math.cos(rad) * r, cy + Math.sin(rad) * r);
                ctx.stroke();
            }

            ctx.save();
            ctx.translate(cx, cy);
            const windAngle = state.windDir * Math.PI / 180;
            ctx.rotate(windAngle);

            ctx.beginPath();
            ctx.moveTo(0, -r + 5);
            ctx.lineTo(4, -r + 16);
            ctx.lineTo(1.5, -r + 16);
            ctx.lineTo(1.5, r - 16);
            ctx.lineTo(-1.5, r - 16);
            ctx.lineTo(-1.5, -r + 16);
            ctx.lineTo(-4, -r + 16);
            ctx.closePath();
            ctx.fillStyle = '#00d2ff';
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(0, 0, 4, 0, 2 * Math.PI);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.restore();

            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
            
            ctx.fillStyle = '#a0aec0';
            ctx.font = 'bold 10px "IBM Plex Sans", sans-serif';
            ctx.fillText("WIND DIRECTION", 207, 85);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 20px "JetBrains Mono", monospace';
            ctx.fillText(state.windDir.toString().padStart(3, '0') + "°", 207, 110);
            drawAwosButton(ctx, "-10", 280, 92, 32, 20, hoverX, hoverY);
            drawAwosButton(ctx, "+10", 317, 92, 32, 20, hoverX, hoverY);

            ctx.fillStyle = '#a0aec0';
            ctx.font = 'bold 10px "IBM Plex Sans", sans-serif';
            ctx.fillText("WIND SPEED", 207, 140);
            ctx.fillStyle = '#ff8800';
            ctx.font = 'bold 20px "JetBrains Mono", monospace';
            ctx.fillText(state.windSpd + " KT", 207, 165);
            drawAwosButton(ctx, "-", 285, 147, 25, 20, hoverX, hoverY);
            drawAwosButton(ctx, "+", 315, 147, 25, 20, hoverX, hoverY);

            ctx.fillStyle = state.windGust > 0 ? '#ff4444' : '#a0aec0';
            ctx.font = 'bold 10px "IBM Plex Sans", sans-serif';
            ctx.fillText("PEAK GUST", 207, 195);
            ctx.fillStyle = state.windGust > 0 ? '#ff4444' : '#ffffff';
            ctx.font = 'bold 20px "JetBrains Mono", monospace';
            ctx.fillText(state.windGust + " KT", 207, 220);
            drawAwosButton(ctx, "-", 285, 202, 25, 20, hoverX, hoverY);
            drawAwosButton(ctx, "+", 315, 202, 25, 20, hoverX, hoverY);

            // Bottom elements
            // TEMPERATURE
            ctx.fillStyle = '#a0aec0';
            ctx.font = 'bold 10px "IBM Plex Sans", sans-serif';
            ctx.fillText("TEMPERATURE", 25, 265);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 20px "JetBrains Mono", monospace';
            ctx.fillText(state.temp + "°C", 25, 290);
            drawAwosButton(ctx, "-", 95, 272, 22, 20, hoverX, hoverY);
            drawAwosButton(ctx, "+", 122, 272, 22, 20, hoverX, hoverY);

            // DEWPOINT
            ctx.fillStyle = '#a0aec0';
            ctx.font = 'bold 10px "IBM Plex Sans", sans-serif';
            ctx.fillText("DEW POINT", 207, 265);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 20px "JetBrains Mono", monospace';
            ctx.fillText(state.dew + "°C", 207, 290);
            drawAwosButton(ctx, "-", 285, 272, 22, 20, hoverX, hoverY);
            drawAwosButton(ctx, "+", 312, 272, 22, 20, hoverX, hoverY);

            // ALTIMETER QNH
            ctx.fillStyle = '#a0aec0';
            ctx.font = 'bold 10px "IBM Plex Sans", sans-serif';
            ctx.fillText("ALTIMETER QNH", 25, 345);
            ctx.fillStyle = '#00d2ff';
            ctx.font = 'bold 20px "JetBrains Mono", monospace';
            ctx.fillText(state.qnh + " hPa", 25, 370);
            drawAwosButton(ctx, "-", 120, 352, 22, 20, hoverX, hoverY);
            drawAwosButton(ctx, "+", 147, 352, 22, 20, hoverX, hoverY);

            // FIELD QFE
            ctx.fillStyle = '#a0aec0';
            ctx.font = 'bold 10px "IBM Plex Sans", sans-serif';
            ctx.fillText("FIELD QFE", 207, 345);
            ctx.fillStyle = '#00d2ff';
            ctx.font = 'bold 20px "JetBrains Mono", monospace';
            ctx.fillText(state.qfe + " hPa", 207, 370);
            drawAwosButton(ctx, "-", 300, 352, 22, 20, hoverX, hoverY);
            drawAwosButton(ctx, "+", 327, 352, 22, 20, hoverX, hoverY);

            // VISIBILITY
            ctx.fillStyle = '#a0aec0';
            ctx.font = 'bold 10px "IBM Plex Sans", sans-serif';
            ctx.fillText("VISIBILITY", 25, 425);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 20px "JetBrains Mono", monospace';
            const visStr = state.vis === 9999 ? "10 km+" : (state.vis + " m");
            ctx.fillText(visStr, 25, 450);
            drawAwosButton(ctx, "-", 125, 432, 22, 20, hoverX, hoverY);
            drawAwosButton(ctx, "+", 152, 432, 22, 20, hoverX, hoverY);

            // ZULU TIME
            ctx.fillStyle = '#a0aec0';
            ctx.font = 'bold 10px "IBM Plex Sans", sans-serif';
            ctx.fillText("ZULU TIME", 207, 425);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 18px "JetBrains Mono", monospace';
            const now = new Date();
            const utcHours = now.getUTCHours().toString().padStart(2, '0');
            const utcMinutes = now.getUTCMinutes().toString().padStart(2, '0');
            const utcSeconds = now.getUTCSeconds().toString().padStart(2, '0');
            ctx.fillText(`${utcHours}:${utcMinutes}:${utcSeconds}Z`, 207, 450);

            ctx.restore();
            awosTexture.needsUpdate = true;
        }

        function drawAwosButton(ctx, text, x, y, w, h, hoverX, hoverY) {
            const isHovered = (hoverX !== null && hoverY !== null && hoverX >= x && hoverX <= x + w && hoverY >= y && hoverY <= y + h);
            ctx.save();
            ctx.beginPath();
            if (ctx.roundRect) {
                ctx.roundRect(x, y, w, h, 4);
            } else {
                ctx.rect(x, y, w, h);
            }
            if (isHovered) {
                ctx.fillStyle = 'rgba(0, 210, 255, 0.35)';
                ctx.strokeStyle = '#00d2ff';
            } else {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
                ctx.strokeStyle = 'rgba(0, 210, 255, 0.2)';
            }
            ctx.fill();
            ctx.lineWidth = 1;
            ctx.stroke();
            
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 11px ui-sans-serif, system-ui, -apple-system, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, x + w / 2, y + h / 2);
            ctx.restore();
        }

        function handleAwosClick(x, y) {
            triggerHapticFeedback(0.6, 50);
            
            const state = awosData || {
                windDir: 340, windSpd: 12, windGust: 0,
                temp: 18, dew: 10, qnh: 1013, qfe: 898, vis: 9999
            };

            let updated = false;

            function inBounds(btnX, btnY, w, h) {
                return (x >= btnX && x <= btnX + w && y >= btnY && y <= btnY + h);
            }

            if (inBounds(280, 92, 32, 20)) { state.windDir = (state.windDir - 10 + 360) % 360; updated = true; }
            else if (inBounds(317, 92, 32, 20)) { state.windDir = (state.windDir + 10) % 360; updated = true; }
            else if (inBounds(285, 147, 25, 20)) { state.windSpd = Math.max(0, state.windSpd - 1); updated = true; }
            else if (inBounds(315, 147, 25, 20)) { state.windSpd = Math.min(100, state.windSpd + 1); updated = true; }
            else if (inBounds(285, 202, 25, 20)) { state.windGust = Math.max(0, state.windGust - 1); updated = true; }
            else if (inBounds(315, 202, 25, 20)) { state.windGust = Math.min(100, state.windGust + 1); updated = true; }
            else if (inBounds(95, 272, 22, 20)) { state.temp -= 1; updated = true; }
            else if (inBounds(122, 272, 22, 20)) { state.temp += 1; updated = true; }
            else if (inBounds(285, 272, 22, 20)) { state.dew -= 1; updated = true; }
            else if (inBounds(312, 272, 22, 20)) { state.dew += 1; updated = true; }
            else if (inBounds(120, 352, 22, 20)) { state.qnh -= 1; updated = true; }
            else if (inBounds(147, 352, 22, 20)) { state.qnh += 1; updated = true; }
            else if (inBounds(300, 352, 22, 20)) { state.qfe -= 1; updated = true; }
            else if (inBounds(327, 352, 22, 20)) { state.qfe += 1; updated = true; }
            else if (inBounds(125, 432, 22, 20)) { state.vis = Math.max(0, state.vis - 1000); updated = true; }
            else if (inBounds(152, 432, 22, 20)) { state.vis = Math.min(9999, state.vis + 1000); updated = true; }

            if (updated) {
                awosData = state;
                drawAwosTablet(x, y);
                
                fetch('/update_awos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(state)
                })
                .then(r => r.json())
                .catch(err => console.error("Error updating AWOS:", err));
            }
        }

        function updateAwosData() {
            fetch('/get_awos')
                .then(r => r.json())
                .then(data => {
                    awosData = data;
                    drawAwosTablet();
                })
                .catch(err => console.error("Error polling AWOS data:", err));
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Run
        function startInitialization() {
            const checkTimer = setInterval(() => {
                if (window.BlueMap && window.BlueMap.Three) {
                    clearInterval(checkTimer);
                    // Copy properties to an extensible plain object to allow OrbitControls to attach itself
                    window.THREE = Object.assign({}, window.BlueMap.Three);
                    
                    console.log("Matched BlueMap Three.js version: r" + window.THREE.REVISION);
                    
                    // Load local OrbitControls
                    const script = document.createElement('script');
                    script.src = "assets/OrbitControls.js";
                    script.onload = () => {
                        console.log("Successfully loaded local OrbitControls");
                        init();
                    };
                    script.onerror = () => {
                        console.error("Failed to load local OrbitControls");
                    };
                    document.head.appendChild(script);
                }
            }, 50);
        }

        startInitialization();
    </script>
</body>
</html>
