<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">AWOS Control Unit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #020617;
            -webkit-font-smoothing: antialiased;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.4) 0%, rgba(2, 6, 23, 1) 100%),
                linear-gradient(rgba(100, 150, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(100, 150, 255, 0.04) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
        }

        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap');

        .glass-panel {
            position: relative;
            background: rgba(15, 25, 40, 0.7);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(140, 190, 255, 0.25);
            border-top: 1px solid rgba(220, 240, 255, 0.45);
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.7), 
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                0 0 60px rgba(100, 170, 255, 0.05);
            overflow: hidden;
        }

        .glass-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(ellipse at 15% 10%, rgba(255, 255, 255, 0.1) 0%, transparent 60%);
            pointer-events: none;
            z-index: 1;
        }

        .glass-panel::after {
            content: '';
            position: absolute;
            top: 0; left: 10%; width: 80%; height: 2px;
            background: linear-gradient(90deg, transparent, rgba(180, 220, 255, 0.45), transparent);
            pointer-events: none;
            z-index: 2;
        }

        .readout-recessed {
            background: rgba(0, 0, 0, 0.5) !important;
            border: 1px solid rgba(0, 0, 0, 0.6);
            border-radius: 16px;
            box-shadow: 
                inset 0 8px 16px rgba(0, 0, 0, 1),
                inset 0 1px 4px rgba(0, 0, 0, 0.8),
                0 1px 0 rgba(255, 255, 255, 0.08);
        }

        /* Compass specific styles */
        .compass-container {
            position: relative;
            width: 400px; 
            height: 400px;
            margin: 0 auto;
            user-select: none;
        }

        .compass-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 330px; 
            height: 330px;
            border-radius: 50%;
            border: 6px solid #1e293b;
            background: radial-gradient(circle, #0f172a 0%, #020617 100%);
            box-shadow: 0 0 40px rgba(0,0,0,0.9), inset 0 0 20px rgba(0,0,0,0.6);
            z-index: 1;
        }

        .compass-number {
            position: absolute;
            color: #94a3b8;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            font-size: 16px;
            transform-origin: center;
            user-select: none;
            pointer-events: none;
            z-index: 10;
        }
        
        .compass-number.cardinal {
            color: #f97316;
            font-size: 22px;
            font-weight: 900;
            text-shadow: 0 0 20px rgba(249, 115, 22, 0.5);
        }

        .runway-line {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 24px; 
            height: 360px; 
            background: rgba(30, 41, 59, 0.5); 
            border: 2px solid rgba(148, 163, 184, 0.2);
            transform: translate(-50%, -50%) rotate(var(--rwy-rot, 30deg)); 
            pointer-events: none;
            z-index: 2; 
        }

        .runway-line::after {
            content: '';
            position: absolute;
            top: 5px; bottom: 5px; left: 50%;
            transform: translateX(-50%);
            width: 2px;
            background: repeating-linear-gradient(to bottom, 
                rgba(255,255,255,0.3) 0, rgba(255,255,255,0.3) 10px, 
                transparent 10px, transparent 20px
            );
        }

        .runway-label-top {
            position: absolute;
            top: -20px; left: 50%;
            transform: translateX(-50%);
            color: #fff; font-size: 12px; font-weight: 900;
        }
        .runway-label-bottom {
            position: absolute;
            bottom: -20px; left: 50%;
            transform: translateX(-50%) rotate(180deg);
            color: #fff; font-size: 12px; font-weight: 900;
        }

        .compass-arrow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 6px;
            height: 150px;
            background: transparent;
            transform-origin: bottom center; 
            transition: transform 2s cubic-bezier(0.4, 0, 0.2, 1); 
            z-index: 20;
        }

        .arrow-head {
            position: absolute;
            top: -15px; left: -10px;
            border-left: 13px solid transparent;
            border-right: 13px solid transparent;
            border-bottom: 25px solid #ff7700; 
            filter: drop-shadow(0 0 10px rgba(255, 119, 0, 0.5));
        }
        
        .arrow-shaft {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 100%;
            background: #ff7700;
        }

        .speed-dial {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 110px; height: 110px;
            background: #020617;
            border: 4px solid #1e293b;
            border-radius: 50%;
            z-index: 30;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 0 40px rgba(0,0,0,1);
        }

        /* Stepper Buttons */
        .stepper-btn {
            background-color: #1e293b;
            border: 1px solid #334155;
            color: #fff;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.1s;
            user-select: none;
        }
        .stepper-btn:hover { background-color: #334155; transform: scale(1.05); }
        .stepper-btn:active { background-color: #f97316; transform: scale(0.9); }

        .input-bare {
            background: transparent;
            border: none;
            outline: none;
            text-align: center;
            width: 100%;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 900;
            color: #fff;
            font-size: 32px;
        }

        .digital-font { font-family: 'JetBrains Mono', monospace; font-weight: 900; }
        .label-tech { font-size: 10px; text-transform: uppercase; font-weight: 900; letter-spacing: 0.2em; color: #4b5563; }

        @keyframes pulse-active { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
        .led-active { animation: pulse-active 1s infinite; }

        /* Remove spinners */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

        @media (max-width: 640px) {
            .compass-container { zoom: 0.7; }
            .glass-panel { padding: 1rem !important; min-height: auto !important; }
            .readout-recessed { padding: 0.75rem !important; }
            .flex-col.gap-6 { gap: 1rem; }
            .text-5xl { font-size: 2rem !important; }
            .input-bare { font-size: 24px !important; }
            #utc-clock { font-size: 1.5rem !important; }
        }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col p-4 font-sans overflow-x-hidden overflow-y-auto">

    <!-- Main Grid -->
    <div class="flex-1 w-full grid grid-cols-1 lg:grid-cols-2 gap-3 items-stretch h-full">
        
        <!-- LEFT COLUMN: Compass & Base Controls -->
        <div class="flex flex-col gap-6">
            <!-- Compass Card -->
            <div class="glass-panel p-8 rounded-[2rem] flex flex-col items-center justify-center min-h-[460px]">
                <div class="readout-recessed p-10 w-full flex flex-col items-center justify-center relative overflow-visible h-full">
                    <!-- Heading Readout -->
                    <div class="absolute top-6 right-8 text-right pointer-events-none">
                        <div class="label-tech mb-[-2px]">WIND BEARING</div>
                        <div id="dir-text" class="text-5xl font-black text-white digital-font">340°</div>
                    </div>
                    
                    <!-- Compass -->
                    <div class="compass-container relative z-10" id="compass">
                        <div class="compass-ring">
                            <div class="runway-line">
                                <span class="runway-label-top" id="rwy-top">03</span>
                                <span class="runway-label-bottom" id="rwy-bot">21</span>
                            </div>
                        </div>
                        <div id="compass-face" class="absolute inset-0 pointer-events-none"></div>
                        <div class="compass-arrow" id="windArrow">
                            <div class="arrow-shaft"></div>
                            <div class="arrow-head"></div>
                        </div>
                        <div class="speed-dial">
                            <span class="text-[10px] text-slate-500 font-black mb-1">KTS</span>
                            <span id="compass-speed-display" class="text-4xl font-black text-orange-500 digital-font">12</span>
                        </div>
                    </div>
                </div>

                <!-- Direction Presets -->
                <div class="mt-8 w-full flex gap-4">
                    <button id="btn-rwy-top" onclick="setDir(30)" class="flex-1 bg-slate-800 hover:bg-slate-700 active:bg-orange-600 border border-slate-600 rounded-lg py-4 text-[10px] font-black text-white transition-all uppercase tracking-[.3em]">
                        RWY 03
                    </button>
                    <button id="btn-rwy-bot" onclick="setDir(210)" class="flex-1 bg-slate-800 hover:bg-slate-700 active:bg-orange-600 border border-slate-600 rounded-lg py-4 text-[10px] font-black text-white transition-all uppercase tracking-[.3em]">
                        RWY 21
                    </button>
                </div>
            </div>

            <!-- Status & Clock Panel (Mirroring Display) -->
            <div class="readout-recessed p-6 flex justify-between items-center bg-black/40">
                <div class="flex flex-col">
                    <div class="flex items-center gap-2 mb-1">
                        <span class="text-slate-500 font-black tracking-[0.4em] text-[9px] uppercase">LINK STATUS: <span id="conn-status" class="text-green-500 led-active">ONLINE</span></span>
                        <div id="led-rx" class="led" style="width: 6px; height: 6px;"></div>
                    </div>
                    <span class="label-tech">ZULU TIME REFERENCE</span>
                </div>
                <div id="utc-clock" class="text-3xl font-black text-white digital-font">00:00:00 Z</div>
            </div>

            <!-- Fine Direction Adjustment -->
            <div class="readout-recessed p-4 flex justify-between items-center bg-black/40">
                <span class="label-tech ml-2">HEADING FINE TUNE</span>
                <div class="flex gap-2">
                    <button class="stepper-btn w-12 h-10 rounded-lg text-sm" onclick="adjustDir(-10)">-10°</button>
                    <button class="stepper-btn w-12 h-10 rounded-lg text-sm" onclick="adjustDir(-1)">-1°</button>
                    <input type="number" id="val-windDir" value="340" onchange="manualDirInput(this.value)" class="input-bare w-16 !text-xl">
                    <button class="stepper-btn w-12 h-10 rounded-lg text-sm" onclick="adjustDir(1)">+1°</button>
                    <button class="stepper-btn w-12 h-10 rounded-lg text-sm" onclick="adjustDir(10)">+10°</button>
                </div>
            </div>
        </div>

        <!-- RIGHT COLUMN: Telemetry Inputs -->
        <div class="flex flex-col gap-6">
            
            <!-- Wind Specs -->
            <div class="glass-panel p-4 rounded-[1.5rem] flex flex-col gap-3 flex-1">
                <header class="flex items-center gap-3 border-b border-white/5 pb-1.5">
                    <div class="w-1.5 h-4 bg-orange-500 rounded-full"></div>
                    <h2 class="text-white text-[10px] font-black tracking-[.2em] uppercase">WIND TELEMETRY</h2>
                </header>
                <div class="grid grid-cols-2 gap-3 flex-1">
                    <div class="readout-recessed p-3 flex flex-col items-center justify-center">
                        <label class="label-tech mb-2">VELOCITY</label>
                        <div class="flex items-center justify-between w-full px-2">
                            <button class="stepper-btn w-9 h-9 rounded-lg" onclick="adjustValue('windSpd', -1)">-</button>
                            <input type="number" id="val-windSpd" value="12" onchange="manualInput('windSpd', this.value)" class="input-bare">
                            <button class="stepper-btn w-9 h-9 rounded-lg" onclick="adjustValue('windSpd', 1)">+</button>
                        </div>
                    </div>
                    <div class="readout-recessed p-3 flex flex-col items-center justify-center">
                        <label class="label-tech mb-2">MAX GUST</label>
                        <div class="flex items-center justify-between w-full px-2">
                            <button class="stepper-btn w-9 h-9 rounded-lg" onclick="adjustValue('windGust', -1)">-</button>
                            <input type="number" id="val-windGust" value="0" onchange="manualInput('windGust', this.value)" class="input-bare text-slate-400">
                            <button class="stepper-btn w-9 h-9 rounded-lg" onclick="adjustValue('windGust', 1)">+</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Meteorological -->
            <div class="glass-panel p-4 rounded-[1.5rem] flex flex-col gap-3 flex-1">
                <header class="flex items-center gap-3 border-b border-white/5 pb-1.5">
                    <div class="w-1.5 h-4 bg-blue-500 rounded-full"></div>
                    <h2 class="text-white text-[10px] font-black tracking-[.2em] uppercase">METEROLOGY & PRESSURE</h2>
                </header>
                <div class="grid grid-cols-3 gap-2 flex-1">
                    <div class="readout-recessed p-2.5 flex flex-col items-center justify-center">
                        <label class="label-tech mb-1">TEMP</label>
                        <div class="flex items-center justify-between w-full">
                            <button class="stepper-btn w-8 h-8 rounded-md" onclick="adjustValue('temp', -1)">-</button>
                            <input type="number" id="val-temp" value="18" onchange="manualInput('temp', this.value)" class="input-bare !text-xl">
                            <button class="stepper-btn w-8 h-8 rounded-md" onclick="adjustValue('temp', 1)">+</button>
                        </div>
                    </div>
                    <div class="readout-recessed p-2.5 flex flex-col items-center justify-center">
                        <label class="label-tech mb-1">DEW PT</label>
                        <div class="flex items-center justify-between w-full">
                            <button class="stepper-btn w-8 h-8 rounded-md" onclick="adjustValue('dew', -1)">-</button>
                            <input type="number" id="val-dew" value="10" onchange="manualInput('dew', this.value)" class="input-bare !text-xl">
                            <button class="stepper-btn w-8 h-8 rounded-md" onclick="adjustValue('dew', 1)">+</button>
                        </div>
                    </div>
                    <div class="readout-recessed p-2.5 flex flex-col items-center justify-center">
                        <label class="label-tech mb-1">VIS</label>
                        <div class="flex items-center justify-between w-full">
                            <button class="stepper-btn w-8 h-8 rounded-md" onclick="adjustValue('vis', -100)">-</button>
                            <input type="number" id="val-vis" value="9999" onchange="manualInput('vis', this.value)" class="input-bare !text-xl">
                            <button class="stepper-btn w-8 h-8 rounded-md" onclick="adjustValue('vis', 100)">+</button>
                        </div>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3 flex-1">
                    <div class="readout-recessed p-3 flex flex-col items-center justify-center">
                        <label class="label-tech mb-1">QNH</label>
                        <div class="flex items-center justify-between w-full px-1">
                            <button class="stepper-btn w-9 h-9 rounded-lg" onclick="adjustValue('qnh', -1)">-</button>
                            <input type="number" id="val-qnh" value="1013" onchange="manualInput('qnh', this.value)" class="input-bare text-2xl text-blue-400">
                            <button class="stepper-btn w-9 h-9 rounded-lg" onclick="adjustValue('qnh', 1)">+</button>
                        </div>
                    </div>
                    <div class="readout-recessed p-3 flex flex-col items-center justify-center">
                        <label class="label-tech mb-1">QFE</label>
                        <div class="flex items-center justify-between w-full px-1">
                            <button class="stepper-btn w-9 h-9 rounded-lg" onclick="adjustValue('qfe', -1)">-</button>
                            <input type="number" id="val-qfe" value="898" onchange="manualInput('qfe', this.value)" class="input-bare text-2xl text-blue-400">
                            <button class="stepper-btn w-9 h-9 rounded-lg" onclick="adjustValue('qfe', 1)">+</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- System Overrides -->
            <div class="readout-recessed p-4 flex flex-col gap-2 border-orange-500/30 border-2">
                <div class="flex gap-4">
                    <button onclick="triggerTempo()" class="flex-1 bg-red-950/80 hover:bg-red-800 border border-red-500/50 text-white font-black py-4 rounded-lg shadow-xl transition-all active:scale-95 flex items-center justify-center gap-3 text-sm uppercase tracking-widest leading-none">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="9" x2="15" y2="15"></line><line x1="15" y1="9" x2="9" y2="15"></line></svg>
                        CUT IT
                    </button>
                    <button onclick="triggerKeepGoing()" class="flex-1 bg-green-950/80 hover:bg-green-800 border border-green-500/50 text-white font-black py-4 rounded-lg shadow-xl transition-all active:scale-95 flex items-center justify-center gap-3 text-sm uppercase tracking-widest leading-none">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                        KEEP GOING
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- Tempo GIF (Hidden) -->
    <img id="tempo-gif" src="" style="display: none; position: fixed; inset: 0; margin: auto; width: 100vw; height: 100vh; object-fit: contain; background: rgba(0,0,0,0.95); z-index: 9999;" />

    <script>
        // --- STATE ---
        let localState = {
            windDir: 340, windSpd: 12, windGust: 0,
            temp: 18, dew: 10, vis: 9999, qnh: 1013, qfe: 898
        };

        const arrow = document.getElementById('windArrow');
        const compassSpeedDisplay = document.getElementById('compass-speed-display');
        const dirTextDisplay = document.getElementById('dir-text');

        // --- FETCHING ---
        async function fetchFromServer() {
            try {
                const res = await fetch('/get_awos');
                if (!res.ok) throw new Error("Server response error");
                const data = await res.json();
                localState = data;
                flashRx();
                updateUI();
                const statusEl = document.getElementById('conn-status');
                if (statusEl) {
                    statusEl.innerText = "ONLINE";
                    statusEl.className = "text-green-500 led-active font-black";
                }
            } catch(e) { 
                console.error("Fetch Err:", e); 
                const statusEl = document.getElementById('conn-status');
                if (statusEl) {
                    statusEl.innerText = "OFFLINE";
                    statusEl.className = "text-red-500 font-black";
                }
            }
        }

        function flashRx() {
            const led = document.getElementById('led-rx');
            if (led) {
                led.classList.add('on');
                setTimeout(() => led.classList.remove('on'), 200);
            }
        }

        async function saveToServer() {
            try {
                await fetch('/update_awos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(localState)
                });
            } catch(e) { console.error("Save Err:", e); }
        }

        // --- UI UPDATES ---
        function updateUI() {
            // Update Inputs
            Object.keys(localState).forEach(key => {
                const el = document.getElementById('val-' + key);
                if (el) el.value = localState[key];
            });

            // Update Compass
            const dirStr = localState.windDir.toString().padStart(3, '0');
            compassSpeedDisplay.innerText = localState.windSpd;
            dirTextDisplay.innerText = dirStr + "°";
            arrow.style.transform = `translate(-50%, -100%) rotate(${localState.windDir}deg)`;
        }

        // --- CONTROLS ---
        function adjustValue(key, delta) {
            let newVal = parseInt(localState[key] || 0) + delta;
            if (key !== 'temp' && key !== 'dew') newVal = Math.max(0, newVal);
            localState[key] = newVal;
            updateUI();
            saveToServer();
        }

        function manualInput(key, val) {
            let newVal = parseInt(val) || 0;
            if (key !== 'temp' && key !== 'dew') newVal = Math.max(0, newVal);
            localState[key] = newVal;
            updateUI();
            saveToServer();
        }

        function setDir(val) {
            localState.windDir = val;
            updateUI();
            saveToServer();
        }

        function adjustDir(delta) {
            localState.windDir = (localState.windDir + delta + 360) % 360;
            updateUI();
            saveToServer();
        }

        function manualDirInput(val) {
            let dir = parseInt(val) || 0;
            dir = ((dir % 360) + 360) % 360;
            localState.windDir = dir;
            updateUI();
            saveToServer();
        }

        function triggerTempo() {
            localState.tempoTrigger = (localState.tempoTrigger || 0) + 1;
            saveToServer();
            playGif("https://media1.tenor.com/m/KdQ8WRxaK7EAAAAC/stop-jk-simmons.gif");
        }

        function triggerKeepGoing() {
            localState.keepGoingTrigger = (localState.keepGoingTrigger || 0) + 1;
            saveToServer();
            playGif("https://media1.tenor.com/m/josaiwe4bSoAAAAC/jk-simmons-whiplash.gif");
        }

        function playGif(url) {
            const gif = document.getElementById('tempo-gif');
            gif.src = url + "?" + new Date().getTime();
            gif.style.display = 'block';
            setTimeout(() => { gif.style.display = 'none'; gif.src = ""; }, 5000);
        }

        function initCompassFace() {
            const faceContainer = document.getElementById('compass-face');
            const radius = 170; 
            for (let i = 10; i <= 360; i += 10) {
                const label = document.createElement('div');
                label.innerText = (i / 10).toString().padStart(2, '0');
                const isCardinal = (i % 90 === 0);
                label.className = `compass-number ${isCardinal ? 'cardinal' : ''}`;
                const rad = (i - 90) * (Math.PI / 180);
                const x = radius * Math.cos(rad);
                const y = radius * Math.sin(rad);
                label.style.left = `50%`; label.style.top = `50%`;
                label.style.transform = `translate(-50%, -50%) translate(${x}px, ${y}px)`;
                faceContainer.appendChild(label);
            }
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('utc-clock').innerText = now.getUTCHours().toString().padStart(2, '0') + ":" + now.getUTCMinutes().toString().padStart(2, '0') + ":" + now.getUTCSeconds().toString().padStart(2, '0') + " Z";
        }

        async function initSettings() {
            try {
                const res = await fetch('/get_generator_settings');
                const data = await res.json();
                if(data.awos_airport_id) document.getElementById('page-title').innerText = data.awos_airport_id + " AWOS Control Unit";
                
                let rwyTopText = data.awos_rwy_top || '03';
                let rwyBotText = data.awos_rwy_bottom || '21';
                
                let topHeading = parseInt(rwyTopText) * 10;
                let botHeading = parseInt(rwyBotText) * 10;

                if(isNaN(topHeading) || topHeading === 0) topHeading = 360;
                if(isNaN(botHeading) || botHeading === 0) botHeading = 360;
                
                document.getElementById('rwy-top').innerText = rwyTopText;
                document.getElementById('rwy-bot').innerText = rwyBotText;
                document.documentElement.style.setProperty('--rwy-rot', topHeading + 'deg');
                
                const btnTop = document.getElementById('btn-rwy-top');
                const btnBot = document.getElementById('btn-rwy-bot');
                
                btnTop.innerText = "RWY " + rwyTopText;
                btnTop.onclick = function() { setDir(topHeading); };
                
                btnBot.innerText = "RWY " + rwyBotText;
                btnBot.onclick = function() { setDir(botHeading); };

            } catch(e) {}
        }

        initCompassFace();
        initSettings();
        setInterval(fetchFromServer, 2000);
        setInterval(initSettings, 5000);
        setInterval(updateClock, 1000);
        fetchFromServer();
        updateClock();
    </script>
</body>
</html>
